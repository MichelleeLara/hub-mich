<!-- @dsCard group="Contenido" height=180 subtitle="Cifras que enlazan a su caso" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100..900&display=swap">
<style>
  .ps-wrap { padding: 24px; background: var(--bg); }
  .ps { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .ps a { position: relative; display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-6) var(--space-6) var(--space-6) 0; color: var(--ink); text-decoration: none; }
  .ps a + a { padding-left: var(--space-6); border-left: 1px solid var(--line); }
  .ps strong { font-family: var(--font-display); font-size: 36px; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; }
  .ps span { font-size: 14px; color: var(--muted); }
  .ps .arrow { position: absolute; top: 32px; right: 20px; }
  @media (max-width: 560px) { .ps { grid-template-columns: 1fr; } .ps a + a { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); } }
</style>
<div class="ps-wrap"><div class="ps">
  <a href="#"><strong>&lt; 2 min</strong><span>Reportes con IA en Luz.ia</span><span class="arrow" aria-hidden="true">↗</span></a>
  <a href="#"><strong>+65%</strong><span>Rendimiento en logística</span><span class="arrow" aria-hidden="true">↗</span></a>
  <a href="#"><strong>6</strong><span>Ingenieros liderados</span><span class="arrow" aria-hidden="true">↗</span></a>
</div></div>
<script>document.querySelectorAll('a[href="#"]').forEach(a => a.addEventListener('click', e => e.preventDefault()));</script>
